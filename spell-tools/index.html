document.getElementById('inputText').addEventListener('input', function() {
    document.getElementById('charCount').textContent = this.value.length + ' / 17';

function spell() {
    const text = document.getElementById('inputText').value;
    if (!text.trim()) return;
    
    let chars = text.split('').slice(0, 17);
    const sp = 17 - chars.length;
    const l = Math.floor(sp/2);
    for (let i=0;i<l;i++) chars.unshift(' ');
    for (let i=0;i<sp-l;i++) chars.push(' ');
    
    let out = '';
    const hexList = [];
    const hexChars = [];
    
    for (const ch of chars) {
        if (HX[ch]) {
            out += `Hex của kí tự ${ch} là ${HX[ch]}\n`;
            hexList.push(HX[ch]);
        }
    }
    hexList.push('3C','23');
    
    // Find hex chars (A-F)
    for (const h of hexList) {
        for (const c of h) {
            if (['A','B','C','D','E','F'].includes(c) && !hexChars.includes(c)) hexChars.push(c);
        }
    }
    if (!hexChars.includes('C')) hexChars.push('C');
    
    out += '\nBước 1: Reset máy:\n [shift] [9] [3] [=] [=]\n';
    out += 'Bước 2: Vào LineI/O:\n [shift] [menu] [1] [3]\n';
    out += 'Bước 3: Vào Basic Overflow:\n [x] [alpha] [CALC] [shift] [x] [x] [shift] [)] [9] [shift] [)] [9] [9] [9] [CALC] [=] [AC] [<] [del] [del] [CALC] [=] [<] [shift] [.]\n';
    out += 'Bước 4: Lấy kí tự Hex cần thiết:\n';
    for (const hc of hexChars) {
        const k = KEY[hc];
        if (k) out += k + ' ';
    }
    out += '\n ([<] [9] [DEL])×' + hexChars.length + ' [del] [del] [del] ([<])×' + hexChars.length + ' [alpha] [∫]\n';
    out += 'Bước 5: Gán hex:\n';
    
    // Template fill (simplified version matching original)
    const A = ["1.0000","__","__","_!","!_","__","×10","!!"];
    const B = ["1.","__","__","__","_!","!_","__","×10","!!"];
    const C = ["1.","__","__","__","_!","!_","__","×10","!!"];
    const vars = [A, B, C];
    const vnames = ['A','B','C'];
    const filled = [];
    let hidx = 0, id = 0;
    
    filled.push(' x:\n');
    for (let vi = 0; vi < 3 && hidx < hexList.length; vi++) {
        const slot = vars[vi];
        let line = vnames[vi] + ' = ';
        for (let si = 0; si < slot.length && hidx < hexList.length; si++) {
            const s = slot[si];
            const byte = hexList[hidx];
            if (s === '1.0000' || s === '1.') { line += s + ' '; continue; }
            if (s === '×10') { line += '×10 '; continue; }
            if (s === '__') { line += byte + ' '; hidx++; continue; }
            if (s === '_!') {
                if (byte && byte.length >= 1 && /[a-zA-Z]/.test(byte[byte.length-1])) line += '20 ';
                else { line += byte + ' '; hidx++; }
                continue;
            }
            if (s === '!_') {
                if (byte && /[a-zA-Z]/.test(byte[0])) line += '20 ';
                else { line += byte + ' '; hidx++; }
                continue;
            }
            if (s === '!!') {
                if (/^\d+$/.test(byte)) { line += byte + '\n'; hidx++; }
                else {
                    if (hexList[hidx-1] === 'F4') { /* skip */ }
                    else line += '20\n';
                }
                id++;
            }
        }
        filled.push(line);
    }
    
    // Generate key presses for hex entry
    const fbytes = [];
    for (const f of filled) {
        if (f.startsWith('A')||f.startsWith('B')||f.startsWith('C')) {
            const eq = f.indexOf('=');
            if (eq >= 0) fbytes.push(...f.substring(eq+1).trim().split(/\s+/).filter(x=>x));
        }
    }
    
    let hexLine = '';
    const asciiLetters = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';

        for (const ch of b) {
            if (/[0-9]/.test(ch)) hexLine += '[' + ch + '] ';
            else if (/[ABCDEF]/.test(ch)) hexLine += '[>] ';
            else if (ch === '.') hexLine += '[.] ';

    out += hexLine + '\n [CALC] ([=])×' + (id + 2) + '\n';
    out += 'Bước 6: Lấy \'an\':\n [x] [alpha] [CALC] [shift] [x] [x] [shift] [)] [9] [shift] [)] [9] [CALC] [=] [<] [shift] [.] [shift] [.] [<] [<] [DEL] [v] [shift] [8] [v] [2] [6] [<] [<] [>] [9] [DEL] [<] [)] [+] [100 số bất kì]\n[CALC] [=]\n';

    }
    
    out += 'Bước 8: Xóa bytes thừa:\n';
    let deleteCount = 0;
    for (let i = fbytes.length - 1; i >= 0; i--) {
        const b = fbytes[i];
        if (b === '20') { if (deleteCount > 0) out += '[<]×' + deleteCount + ' '; out += '[DEL] '; deleteCount = 0; }
        else if (b === '1.' || b === '1.0000') { if (deleteCount > 0) out += '[<]×' + deleteCount + ' '; out += '[DEL]×2 '; deleteCount = 0; }
        else if (b === '×10' || b === 'F4') { /* skip */ }
        else { deleteCount++; }

    if (deleteCount > 0) out += '[<]×' + deleteCount;

    for (const ch of chars) {
