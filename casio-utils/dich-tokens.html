<!DOCTYPE html>
<html lang="vi" data-v="2.1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dịch tokens - Casio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#f5f5f5;color:#333;animation:fadeIn .3s ease;min-height:100vh;display:flex;flex-direction:column}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.top{display:flex;align-items:center;padding:12px 24px;background:#e8e8e8;border-bottom:1px solid #ddd}
.top .brand{font-size:16px;font-weight:700;color:#007acc}
.top .spacer{flex:1}
.top .exit{cursor:pointer;color:#d33;font-size:14px}
.main{flex:1;padding:24px;max-width:700px;margin:auto;width:100%}
h3{color:#007acc;margin-bottom:4px}
.sub{color:#888;font-size:13px;margin-bottom:16px}
.tbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tbar label{font-size:13px;color:#666}
.tbar select{padding:6px 10px;border:1px solid #ccc;border-radius:5px;font-size:13px;outline:none}
.tbar .btn{padding:6px 16px;background:#f0f0f0;border:1px solid #ccc;border-radius:5px;cursor:pointer;font-size:12px;user-select:none}
.tbar .btn:hover{background:#e0e0e0}
.tbar .btn.pm{background:#007acc;color:#fff;border-color:#007acc}
.tbar .btn.pm:hover{background:#0066aa}
.tbar .btn.dg{color:#d33}
textarea{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:6px;font-family:monospace;font-size:12px;outline:none;resize:vertical;min-height:80px}
textarea:focus{border-color:#007acc}
textarea.out{background:#fafafa;color:#c60;min-height:60px}
.bar{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:8px 24px;background:#e8e8e8;border-top:1px solid #ddd;font-size:12px;color:#666}
</style>
</head>
<body>

<div class="top">
  <span class="brand"><i class="fas fa-exchange-alt"></i> Dịch tokens</span>
  <span class="spacer"></span>
  <span class="exit" onclick="window.location.href='../index.html'"><i class="fas fa-times"></i> Thoát</span>
</div>

<div class="main">
  <h3>Dịch tokens</h3>
  <p class="sub">Dịch hex tokens của Casio</p>

  <div class="tbar">
    <label>Model:</label>
    <select id="modelSelect">
      <option value="580vnx">580VNX</option>
      <option value="880btg">880BTG</option>
    </select>
    <span class="btn pm" onclick="dich()"><i class="fas fa-language"></i> Dịch</span>
    <span class="btn dg" onclick="xoa()"><i class="fas fa-trash"></i> Xóa</span>
    <span class="btn" onclick="saoChep()"><i class="fas fa-copy"></i> Sao chép</span>
  </div>

  <label style="font-size:12px;color:#888;display:block;margin-bottom:4px">Nhập hex tokens:</label>
  <textarea id="inputText" placeholder="Nhập hex tokens (ví dụ: 77 78 79)..." onkeydown="if(event.key==='Enter'&&event.ctrlKey)dich()"></textarea>

  <label style="font-size:12px;color:#888;display:block;margin:8px 0 4px">Kết quả:</label>
  <textarea id="outputText" class="out" placeholder="Kết quả dịch..." readonly></textarea>
</div>

<div class="bar"><span>Dịch tokens</span><span></span></div>

<script>
// Token data for 580VNX
const T580 = {"00":"_","46":"e","22":"pi","2c":",","2d":"x10^","2e":".","30":"0","31":"1","32":"2","33":"3","34":"4","35":"5","36":"6","37":"7","38":"8","39":"9","40":"m","41":"ans","42":"a","43":"b","44":"c","45":"d","47":"f","48":"x","49":"y","4a":"preans","4b":"z","50":"∑(","51":"∫(","52":"d/dx","53":"∏(","60":"(","68":"abs(","69":"rnd(","6C":"sinh(","6D":"cosh(","6E":"tanh(","6F":"sinh⁻¹(","70":"cosh⁻¹(","71":"tanh⁻¹(","72":"e^(","73":"10^(","74":"√(","75":"ln(","76":"³√(","77":"sin(","78":"cos(","79":"tan(","7a":"sin⁻¹(","7b":"cos⁻¹(","7c":"tan⁻¹(","7d":"log(","83":"int(","84":"intg(","87":"ranint#(","88":"gcd(","89":"lcm(","8a":"rndfix(","a5":"=","a6":"+","a7":"-","a8":"*","a9":"÷","aa":"mod","c0":"−","c8":"/","c9":"^(","ca":"x^√(","d0":")","d4":"⁻¹","d5":"²","d6":"³","d7":"%","d8":"!","fd18":"ran","fd20":"an"};

// Token data for 880BTG
const T880 = {"00":"_","46":"e","22":"pi","2c":",","2d":"x10^","2e":".","30":"0","31":"1","32":"2","33":"3","34":"4","35":"5","36":"6","37":"7","38":"8","39":"9","60":"(","fd20":"an"};

function dich() {
  const model = document.getElementById('modelSelect').value;
  const input = document.getElementById('inputText').value.trim();
  if (!input) return;
  
  const tokens = model === '580vnx' ? T580 : T880;
  const hexes = input.split(/\s+/).filter(h => h);
  const results = [];
  
  for (const hex of hexes) {
    const clean = hex.replace(/[<>]/g, '');
    const upper = clean.toUpperCase();
    if (tokens[upper]) results.push(tokens[upper]);
    else if (tokens[clean]) results.push(tokens[clean]);
    else results.push('<' + clean.toLowerCase() + '>');
  }
  
  document.getElementById('outputText').value = results.join(' ');
}

function xoa() {
  document.getElementById('inputText').value = '';
  document.getElementById('outputText').value = '';
}

function saoChep() {
  const out = document.getElementById('outputText');
  if (out.value) navigator.clipboard.writeText(out.value).catch(()=>{});
}
</script>
</body>
</html>
