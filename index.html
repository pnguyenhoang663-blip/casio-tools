<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casio Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>document.addEventListener('DOMContentLoaded',()=>{const p=window.location.pathname;const onTool=p.includes('compiler')||p.includes('pixel');document.querySelectorAll('.nav-link').forEach(a=>{if(a.getAttribute('href')&&p.includes(a.getAttribute('href').replace('../','')))a.classList.add('active')});if(onTool)document.querySelector('.dropbtn')?.classList.add('active')})</script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><i class="fas fa-calculator"></i> Casio Tools</div>
        <div class="nav-menu">
            <a href="compiler/index.html" class="nav-link"><i class="fas fa-code"></i> Compiler</a>
            <a href="pixel-tools/index.html" class="nav-link"><i class="fas fa-paint-brush"></i> Pixel</a>
            <div class="dropdown">
                <button class="dropbtn"><i class="fas fa-tools"></i> Tiện ích ▾</button>
                <div class="dropdown-content">
                    <a href="compiler/index.html"><i class="fas fa-code"></i> Compiler</a>
                    <a href="pixel-tools/index.html"><i class="fas fa-paint-brush"></i> Pixel tools</a>
                    <a href="#" class="coming-soon"><i class="fas fa-magic"></i> Spell tools <span class="badge">Sắp ra mắt</span></a>
                </div>
            </div>
        </div>
    </nav>

    <main class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Casio tools</h1>
            <p class="hero-subtitle">Bộ công cụ dành cho casio</p>
            <div class="hero-buttons">
                <a href="compiler/index.html" class="btn btn-primary">
                    <span class="btn-icon"><i class="fas fa-code"></i></span>
                    <span class="btn-title">Compiler</span>
                    <span class="btn-desc">Dịch asm sang hex</span>
                </a>
                <a href="pixel-tools/index.html" class="btn btn-primary">
                    <span class="btn-icon"><i class="fas fa-paint-brush"></i></span>
                    <span class="btn-title">Pixel tools</span>
                    <span class="btn-desc">Vẽ pixel, dịch ảnh</span>
                </a>
                <a href="#" class="btn btn-disabled">
                    <span class="btn-icon"><i class="fas fa-cube"></i></span>
                    <span class="btn-title">Tiện ích Casio</span>
                    <span class="btn-desc">Sắp ra mắt</span>
                </a>
                <a href="#" class="btn btn-disabled">
                    <span class="btn-icon"><i class="fas fa-magic"></i></span>
                    <span class="btn-title">Spell tools</span>
                    <span class="btn-desc">Sắp ra mắt</span>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
