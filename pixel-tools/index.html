<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #1e1e1e; --bg2: #252526; --bg3: #2d2d2d; --bg4: #333;
            --border: #3e3e42; --text: #ccc; --text2: #888;
            --accent: #007acc; --font: 'Consolas', monospace;
            --font-ui: 'Segoe UI', system-ui, sans-serif;
        }
        body { font-family: var(--font-ui); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
        .topbar { display: flex; align-items: center; padding: 0 12px; height: 40px; background: var(--bg2); border-bottom: 1px solid var(--border); gap: 0; flex-shrink: 0; }
        .topbar .tab { padding: 8px 18px; cursor: pointer; font-size: 13px; color: var(--text2); border-bottom: 2px solid transparent; transition: all 0.15s; }
        .topbar .tab:hover { color: var(--text); background: var(--bg3); }
        .topbar .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .topbar .spacer { flex: 1; }
        .topbar .exit-btn { padding: 6px 12px; cursor: pointer; color: var(--red, #f44747); font-size: 13px; border-radius: 4px; }
        .topbar .exit-btn:hover { background: var(--bg3); }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .panel.active { display: flex; }
        .tool-row { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
        .tool-row label { font-size: 12px; color: var(--text2); }
        .tool-btn { padding: 4px 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; color: var(--text); cursor: pointer; font-size: 12px; font-family: var(--font-ui); transition: all 0.15s; }
        .tool-btn:hover { background: var(--bg4); border-color: var(--accent); }
        .tool-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .tool-btn.danger { color: #f44747; }
        .tool-btn.active { background: var(--accent); color: #fff; }
        .tool-input { padding: 3px 6px; background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-radius: 3px; font-size: 12px; width: 50px; outline: none; font-family: var(--font); }
        .tool-input:focus { border-color: var(--accent); }
        .tool-select { padding: 3px 6px; background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-radius: 3px; font-size: 12px; outline: none; }
        .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
        .content-area { flex: 1; display: flex; overflow: hidden; }
        .canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 12px; background: var(--bg); }
        .canvas-wrap canvas { image-rendering: pixelated; border: 1px solid var(--border); }
        .hex-panel { width: 320px; display: flex; flex-direction: column; border-left: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; }
        .hex-panel .hdr { padding: 6px 10px; font-size: 11px; color: var(--text2); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .hex-panel .hdr .cp { cursor: pointer; color: var(--accent); }
        .hex-panel .hdr .cp:hover { text-decoration: underline; }
        .hex-area { flex: 1; padding: 8px 10px; font-family: var(--font); font-size: 11px; overflow: auto; white-space: pre; color: #ce9178; user-select: text; }
        .preview-wrap { display: flex; align-items: center; justify-content: center; padding: 12px; background: var(--bg); flex: 1; }
        .preview-wrap canvas { image-rendering: pixelated; border: 1px solid var(--border); }
        .upload-area { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; border: 2px dashed var(--border); border-radius: 8px; cursor: pointer; margin: 12px; }
        .upload-area:hover { border-color: var(--accent); }
        .grid-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 12px; background: var(--bg); }
        .grid-wrap canvas { image-rendering: pixelated; border: 1px solid var(--border); cursor: crosshair; }
        .draw-canvas { cursor: crosshair; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg2); }
        ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
        .preview-upload { max-width: 192px; max-height: 63px; display: none; }
        .split-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .split-image-area { flex: 1; display: flex; overflow: hidden; }
        .split-image-area .left-preview { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; }
        .line-preview { position: relative; }
        .line-coords { padding: 4px 10px; font-size: 12px; color: var(--text2); text-align: center; background: var(--bg2); border-top: 1px solid var(--border); }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="tab active" data-tab="image" onclick="switchTab('image')"><i class="fas fa-image"></i> Dịch ảnh</div>
        <div class="tab" data-tab="bitmap" onclick="switchTab('bitmap')"><i class="fas fa-vector-square"></i> Bitmap</div>
        <div class="tab" data-tab="pixel" onclick="switchTab('pixel')"><i class="fas fa-pencil-alt"></i> Pixel</div>
        <div class="tab" data-tab="line" onclick="switchTab('line')"><i class="fas fa-slash"></i> Line draw</div>
        <div class="spacer"></div>
        <div class="exit-btn" onclick="window.location.href='../index.html'"><i class="fas fa-times"></i> Thoát</div>
    </div>

    <div class="main">
        <!-- === TAB 1: Dịch ảnh === -->
        <div class="panel active" id="panel-image">
            <div class="tool-row">
                <button class="tool-btn primary" onclick="document.getElementById('imgInput').click()"><i class="fas fa-upload"></i> Tải ảnh</button>
                <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="loadImage(event)">
                <span class="sep"></span>
                <label>Rộng:</label> <input class="tool-input" id="imgW" value="192" onchange="regenImage()">
                <label>Cao:</label> <input class="tool-input" id="imgH" value="63" onchange="regenImage()">
                <button class="tool-btn" onclick="regenImage()"><i class="fas fa-sync"></i> Tạo lại</button>
                <span class="sep"></span>
                <label>Threshold:</label> <input class="tool-input" id="threshold" value="128" style="width:40px" onchange="regenImage()">
            </div>
            <div class="split-image-area">
                <div class="left-preview" id="imagePreview"><canvas id="previewCanvas"></canvas></div>
                <div class="hex-panel">
                    <div class="hdr"><span>Hex output</span><span class="cp" onclick="copyHex()"><i class="fas fa-copy"></i> Copy</span></div>
                    <div class="hex-area" id="imageHex">Chưa có ảnh</div>
                </div>
            </div>
        </div>

        <!-- === TAB 2: Bitmap === -->
        <div class="panel" id="panel-bitmap">
            <div class="tool-row">
                <label>Rộng:</label> <input class="tool-input" id="bmpW" value="24" onchange="initBitmap()">
                <label>Cao:</label> <input class="tool-input" id="bmpH" value="16" onchange="initBitmap()">
                <label>Zoom:</label> <input class="tool-input" id="bmpZoom" value="16" style="width:40px" onchange="initBitmap()">
                <span class="sep"></span>
                <button class="tool-btn" onclick="initBitmap()"><i class="fas fa-plus"></i> Tạo</button>
                <button class="tool-btn danger" onclick="clearBitmap()"><i class="fas fa-trash"></i> Xóa</button>
                <button class="tool-btn" onclick="undoBitmap()"><i class="fas fa-undo"></i> Hoàn tác</button>
                <button class="tool-btn primary active" id="bmpMode" onclick="toggleBmpMode()"><i class="fas fa-pen"></i> Vẽ</button>
            </div>
            <div class="content-area">
                <div class="grid-wrap"><canvas id="bmpCanvas"></canvas></div>
                <div class="hex-panel">
                    <div class="hdr"><span>Hex output</span><span class="cp" onclick="copyHexBmp()"><i class="fas fa-copy"></i> Copy</span></div>
                    <div class="hex-area" id="bmpHex"></div>
                </div>
            </div>
        </div>

        <!-- === TAB 3: Pixel === -->
        <div class="panel" id="panel-pixel">
            <div class="tool-row">
                <label>Rộng:</label> <input class="tool-input" id="pxW" value="24" onchange="initPixel()">
                <label>Cao:</label> <input class="tool-input" id="pxH" value="16" onchange="initPixel()">
                <label>Zoom:</label> <input class="tool-input" id="pxZoom" value="16" style="width:40px" onchange="initPixel()">
                <span class="sep"></span>
                <button class="tool-btn" onclick="initPixel()"><i class="fas fa-plus"></i> Tạo</button>
                <button class="tool-btn" onclick="document.getElementById('pxImgInput').click()"><i class="fas fa-upload"></i> Tải ảnh</button>
                <input type="file" id="pxImgInput" accept="image/*" style="display:none" onchange="loadPixelImage(event)">
                <button class="tool-btn danger" onclick="clearPixel()"><i class="fas fa-trash"></i> Xóa</button>
                <button class="tool-btn primary active" id="pxMode" onclick="togglePxMode()"><i class="fas fa-pen"></i> Vẽ</button>
                <span class="sep"></span>
                <button class="tool-btn" onclick="undoPixel()"><i class="fas fa-undo"></i> Hoàn tác</button>
            </div>
            <div class="content-area">
                <div class="grid-wrap"><canvas id="pxCanvas"></canvas></div>
                <div class="hex-panel">
                    <div class="hdr"><span>Hex output</span><span class="cp" onclick="copyHexPx()"><i class="fas fa-copy"></i> Copy</span></div>
                    <div class="hex-area" id="pxHex"></div>
                </div>
            </div>
        </div>

        <!-- === TAB 4: Line draw === -->
        <div class="panel" id="panel-line">
            <div class="tool-row">
                <label>Zoom:</label> <input class="tool-input" id="lineZoom" value="8" style="width:40px" onchange="initLineDraw()">
                <span class="sep"></span>
                <button class="tool-btn danger" onclick="clearLine()"><i class="fas fa-trash"></i> Xóa</button>
                <button class="tool-btn" onclick="undoLine()"><i class="fas fa-undo"></i> Hoàn tác</button>
                <span class="sep"></span>
                <label>Kéo để vẽ line</label>
            </div>
            <div class="content-area">
                <div class="grid-wrap"><canvas id="lineCanvas" class="draw-canvas"></canvas></div>
                <div class="hex-panel">
                    <div class="hdr"><span>ROP output</span><span class="cp" onclick="copyLineRop()"><i class="fas fa-copy"></i> Copy</span></div>
                    <div class="hex-area" id="lineHex"></div>
                </div>
            </div>
        </div>
    </div>

<script>
// ===== UTILS =====
const HEX_CHARS = '0123456789ABCDEF';
function byteToHex(b) { return HEX_CHARS[(b>>4)&15] + HEX_CHARS[b&15]; }
function toHex(bytes) { return bytes.map(byteToHex).join(' '); }

// ===== TAB SWITCHING =====
function switchTab(name) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.topbar .tab').forEach(t => t.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    document.querySelector('.topbar .tab[data-tab="' + name + '"]').classList.add('active');
}

// ===== IMAGE TO HEX =====
let imgData = null;
function loadImage(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() { imgData = img; regenImage(); };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
}

function regenImage() {
    const canvas = document.getElementById('previewCanvas');
    const w = parseInt(document.getElementById('imgW').value) || 192;
    const h = parseInt(document.getElementById('imgH').value) || 63;
    const thresh = parseInt(document.getElementById('threshold').value) || 128;
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');

    if (!imgData) {
        ctx.fillStyle = '#111'; ctx.fillRect(0, 0, w, h);
        document.getElementById('imageHex').textContent = 'Tải ảnh lên trước';
        return;
    }

    ctx.drawImage(imgData, 0, 0, w, h);
    const imageData = ctx.getImageData(0, 0, w, h);
    const pixels = imageData.data;

    // Convert to 1-bit per pixel, packed into bytes (MSB first)
    const bytes = [];
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x += 8) {
            let byte = 0;
            for (let b = 0; b < 8; b++) {
                const px = x + b;
                if (px >= w) continue;
                const idx = (y * w + px) * 4;
                const gray = pixels[idx] * 0.299 + pixels[idx+1] * 0.587 + pixels[idx+2] * 0.114;
                if (gray < thresh) byte |= (1 << (7 - b)); // black pixel = 1
            }
            bytes.push(byte);
        }
    }

    // Render preview (black/white)
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const byteIdx = y * Math.ceil(w / 8) + Math.floor(x / 8);
            const bitIdx = 7 - (x % 8);
            const isBlack = (bytes[byteIdx] >> bitIdx) & 1;
            const idx = (y * w + x) * 4;
            const val = isBlack ? 0 : 255;
            pixels[idx] = val; pixels[idx+1] = val; pixels[idx+2] = val; pixels[idx+3] = 255;
        }
    }
    ctx.putImageData(imageData, 0, 0);

    // Show hex
    const hexStr = bytes.map(byteToHex).join(' ');
    document.getElementById('imageHex').textContent = hexStr;
}

function copyHex() {
    const text = document.getElementById('imageHex').textContent;
    if (text && text !== 'Chưa có ảnh') {
        navigator.clipboard.writeText(text).catch(()=>{});
    }
}

// ===== BITMAP EDITOR =====
let bmpData = []; let bmpHistory = []; let bmpMode = 'draw';
function initBitmap() {
    const w = parseInt(document.getElementById('bmpW').value) || 24;
    const h = parseInt(document.getElementById('bmpH').value) || 16;
    const zoom = parseInt(document.getElementById('bmpZoom').value) || 16;
    if (w < 1 || w > 192 || h < 1 || h > 63) return;

    if (bmpData.length === 0) {
        bmpData = new Uint8Array(h * Math.ceil(w / 8));
        bmpHistory = [new Uint8Array(bmpData)];
    }

    const canvas = document.getElementById('bmpCanvas');
    canvas.width = w * zoom; canvas.height = h * zoom;
    const ctx = canvas.getContext('2d');
    renderBmp(ctx, w, h, zoom);
    updateBmpHex(w, h);

    canvas.onmousedown = function(e) { startBmpDraw(e, w, h, zoom); };
    canvas.onmousemove = function(e) { moveBmpDraw(e, w, h, zoom); };
    canvas.onmouseup = function() { endBmpDraw(w, h); };
    canvas.onmouseleave = function() { endBmpDraw(w, h); };
}

function renderBmp(ctx, w, h, zoom) {
    const byteW = Math.ceil(w / 8);
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const byteIdx = y * byteW + Math.floor(x / 8);
            const bitIdx = 7 - (x % 8);
            const on = (bmpData[byteIdx] >> bitIdx) & 1;
            ctx.fillStyle = on ? '#fff' : '#111';
            ctx.fillRect(x * zoom, y * zoom, zoom, zoom);
        }
    }
    // Grid lines
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= w; x++) { ctx.beginPath(); ctx.moveTo(x*zoom,0); ctx.lineTo(x*zoom,h*zoom); ctx.stroke(); }
    for (let y = 0; y <= h; y++) { ctx.beginPath(); ctx.moveTo(0,y*zoom); ctx.lineTo(w*zoom,y*zoom); ctx.stroke(); }
}

function toggleBmpMode() {
    bmpMode = bmpMode === 'draw' ? 'erase' : 'draw';
    document.getElementById('bmpMode').innerHTML = '<i class="fas fa-' + (bmpMode === 'draw' ? 'pen' : 'eraser') + '"></i> ' + (bmpMode === 'draw' ? 'Vẽ' : 'Xóa');
    document.getElementById('bmpMode').classList.toggle('primary', bmpMode === 'draw');
}

let bmpDrawing = false;
function startBmpDraw(e, w, h, zoom) {
    bmpDrawing = true;
    const rect = e.target.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) / zoom);
    const y = Math.floor((e.clientY - rect.top) / zoom);
    if (x < 0 || x >= w || y < 0 || y >= h) return;
    const byteW = Math.ceil(w / 8);
    const byteIdx = y * byteW + Math.floor(x / 8);
    const bitIdx = 7 - (x % 8);
    if (bmpMode === 'draw') bmpData[byteIdx] |= (1 << bitIdx);
    else bmpData[byteIdx] &= ~(1 << bitIdx);
    const ctx = e.target.getContext('2d');
    const on = (bmpData[byteIdx] >> bitIdx) & 1;
    ctx.fillStyle = on ? '#fff' : '#111';
    ctx.fillRect(x * zoom, y * zoom, zoom, zoom);
}

function moveBmpDraw(e, w, h, zoom) {
    if (!bmpDrawing) return;
    startBmpDraw(e, w, h, zoom);
}

function endBmpDraw(w, h) {
    if (!bmpDrawing) return;
    bmpDrawing = false;
    bmpHistory.push(new Uint8Array(bmpData));
    if (bmpHistory.length > 50) bmpHistory.shift();
    updateBmpHex(w, h);
}

function clearBitmap() {
    const w = parseInt(document.getElementById('bmpW').value) || 24;
    const h = parseInt(document.getElementById('bmpH').value) || 16;
    bmpData = new Uint8Array(h * Math.ceil(w / 8));
    bmpHistory = [new Uint8Array(bmpData)];
    initBitmap();
}

function undoBitmap() {
    if (bmpHistory.length > 1) {
        bmpHistory.pop();
        bmpData = new Uint8Array(bmpHistory[bmpHistory.length - 1]);
        const w = parseInt(document.getElementById('bmpW').value) || 24;
        const h = parseInt(document.getElementById('bmpH').value) || 16;
        const zoom = parseInt(document.getElementById('bmpZoom').value) || 16;
        const canvas = document.getElementById('bmpCanvas');
        const ctx = canvas.getContext('2d');
        renderBmp(ctx, w, h, zoom);
        updateBmpHex(w, h);
    }
}

function updateBmpHex(w, h) {
    const hexStr = toHex(Array.from(bmpData));
    document.getElementById('bmpHex').textContent = hexStr;
}

function copyHexBmp() {
    const text = document.getElementById('bmpHex').textContent;
    if (text) navigator.clipboard.writeText(text).catch(()=>{});
}

// ===== PIXEL EDITOR (similar to bitmap with image load) =====
let pxData = []; let pxHistory = []; let pxMode = 'draw';
function initPixel() {
    const w = parseInt(document.getElementById('pxW').value) || 24;
    const h = parseInt(document.getElementById('pxH').value) || 16;
    const zoom = parseInt(document.getElementById('pxZoom').value) || 16;
    if (w < 1 || w > 192 || h < 1 || h > 63) return;

    if (pxData.length === 0) {
        pxData = new Uint8Array(h * Math.ceil(w / 8));
        pxHistory = [new Uint8Array(pxData)];
    }

    const canvas = document.getElementById('pxCanvas');
    canvas.width = w * zoom; canvas.height = h * zoom;
    const ctx = canvas.getContext('2d');
    renderPx(ctx, w, h, zoom);
    updatePxHex(w, h);

    canvas.onmousedown = function(e) { startPxDraw(e, w, h, zoom); };
    canvas.onmousemove = function(e) { movePxDraw(e, w, h, zoom); };
    canvas.onmouseup = function() { endPxDraw(w, h); };
    canvas.onmouseleave = function() { endPxDraw(w, h); };
}

function renderPx(ctx, w, h, zoom) {
    const byteW = Math.ceil(w / 8);
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const byteIdx = y * byteW + Math.floor(x / 8);
            const bitIdx = 7 - (x % 8);
            const on = (pxData[byteIdx] >> bitIdx) & 1;
            ctx.fillStyle = on ? '#fff' : '#111';
            ctx.fillRect(x * zoom, y * zoom, zoom, zoom);
        }
    }
    ctx.strokeStyle = '#333'; ctx.lineWidth = 0.5;
    for (let x = 0; x <= w; x++) { ctx.beginPath(); ctx.moveTo(x*zoom,0); ctx.lineTo(x*zoom,h*zoom); ctx.stroke(); }
    for (let y = 0; y <= h; y++) { ctx.beginPath(); ctx.moveTo(0,y*zoom); ctx.lineTo(w*zoom,y*zoom); ctx.stroke(); }
}

function togglePxMode() {
    pxMode = pxMode === 'draw' ? 'erase' : 'draw';
    document.getElementById('pxMode').innerHTML = '<i class="fas fa-' + (pxMode === 'draw' ? 'pen' : 'eraser') + '"></i> ' + (pxMode === 'draw' ? 'Vẽ' : 'Xóa');
    document.getElementById('pxMode').classList.toggle('primary', pxMode === 'draw');
}

let pxDrawing = false;
function startPxDraw(e, w, h, zoom) {
    pxDrawing = true;
    const rect = e.target.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) / zoom);
    const y = Math.floor((e.clientY - rect.top) / zoom);
    if (x < 0 || x >= w || y < 0 || y >= h) return;
    const byteW = Math.ceil(w / 8);
    const byteIdx = y * byteW + Math.floor(x / 8);
    const bitIdx = 7 - (x % 8);
    if (pxMode === 'draw') pxData[byteIdx] |= (1 << bitIdx);
    else pxData[byteIdx] &= ~(1 << bitIdx);
    const ctx = e.target.getContext('2d');
    const on = (pxData[byteIdx] >> bitIdx) & 1;
    ctx.fillStyle = on ? '#fff' : '#111';
    ctx.fillRect(x * zoom, y * zoom, zoom, zoom);
}

function movePxDraw(e, w, h, zoom) { if (pxDrawing) startPxDraw(e, w, h, zoom); }
function endPxDraw(w, h) {
    if (!pxDrawing) return;
    pxDrawing = false;
    pxHistory.push(new Uint8Array(pxData));
    if (pxHistory.length > 50) pxHistory.shift();
    updatePxHex(w, h);
}

function clearPixel() {
    const w = parseInt(document.getElementById('pxW').value) || 24;
    const h = parseInt(document.getElementById('pxH').value) || 16;
    pxData = new Uint8Array(h * Math.ceil(w / 8));
    pxHistory = [new Uint8Array(pxData)];
    initPixel();
}

function undoPixel() {
    if (pxHistory.length > 1) {
        pxHistory.pop();
        pxData = new Uint8Array(pxHistory[pxHistory.length - 1]);
        const w = parseInt(document.getElementById('pxW').value) || 24;
        const h = parseInt(document.getElementById('pxH').value) || 16;
        const zoom = parseInt(document.getElementById('pxZoom').value) || 16;
        const canvas = document.getElementById('pxCanvas');
        const ctx = canvas.getContext('2d');
        renderPx(ctx, w, h, zoom);
        updatePxHex(w, h);
    }
}

function updatePxHex(w, h) {
    document.getElementById('pxHex').textContent = toHex(Array.from(pxData));
}

function copyHexPx() {
    const text = document.getElementById('pxHex').textContent;
    if (text) navigator.clipboard.writeText(text).catch(()=>{});
}

function loadPixelImage(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
            const w = parseInt(document.getElementById('pxW').value) || 24;
            const h = parseInt(document.getElementById('pxH').value) || 16;
            const offscreen = document.createElement('canvas');
            offscreen.width = w; offscreen.height = h;
            const octx = offscreen.getContext('2d');
            octx.drawImage(img, 0, 0, w, h);
            const imageData = octx.getImageData(0, 0, w, h);
            const pixels = imageData.data;

            const byteW = Math.ceil(w / 8);
            pxData = new Uint8Array(h * byteW);
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const idx = (y * w + x) * 4;
                    const gray = pixels[idx] * 0.299 + pixels[idx+1] * 0.587 + pixels[idx+2] * 0.114;
                    const byteIdx = y * byteW + Math.floor(x / 8);
                    const bitIdx = 7 - (x % 8);
                    if (gray < 128) pxData[byteIdx] |= (1 << bitIdx);
                }
            }
            pxHistory = [new Uint8Array(pxData)];
            initPixel();
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
}

// ===== LINE DRAW =====
let lineHistory = []; let linePixels = []; let lineDrawing = false; let lineStart = null;
function initLineDraw() {
    const zoom = parseInt(document.getElementById('lineZoom').value) || 8;
    const w = 192, h = 63;
    const canvas = document.getElementById('lineCanvas');
    canvas.width = w * zoom; canvas.height = h * zoom;
    if (linePixels.length === 0) { linePixels = new Array(h).fill(null).map(() => new Array(w).fill(false)); lineHistory = []; }
    renderLine(zoom);
    updateLineRop();

    canvas.onmousedown = function(e) { startLine(e, zoom); };
    canvas.onmousemove = function(e) { moveLine(e, zoom); };
    canvas.onmouseup = function() { endLine(); };
    canvas.onmouseleave = function() { endLine(); };
}

function renderLine(zoom) {
    const canvas = document.getElementById('lineCanvas');
    const ctx = canvas.getContext('2d');
    const w = 192, h = 63;
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            ctx.fillStyle = linePixels[y][x] ? '#fff' : '#111';
            ctx.fillRect(x * zoom, y * zoom, zoom, zoom);
        }
    }
    ctx.strokeStyle = '#333'; ctx.lineWidth = 0.5;
    for (let x = 0; x <= w; x++) { ctx.beginPath(); ctx.moveTo(x*zoom,0); ctx.lineTo(x*zoom,h*zoom); ctx.stroke(); }
    for (let y = 0; y <= h; y++) { ctx.beginPath(); ctx.moveTo(0,y*zoom); ctx.lineTo(w*zoom,y*zoom); ctx.stroke(); }
}

function drawLineOnGrid(x1, y1, x2, y2) {
    const dx = Math.abs(x2 - x1), dy = Math.abs(y2 - y1);
    const sx = x1 < x2 ? 1 : -1, sy = y1 < y2 ? 1 : -1;
    let err = dx - dy;
    while (true) {
        if (x1 >= 0 && x1 < 192 && y1 >= 0 && y1 < 63) linePixels[y1][x1] = true;
        if (x1 === x2 && y1 === y2) break;
        const e2 = 2 * err;
        if (e2 > -dy) { err -= dy; x1 += sx; }
        if (e2 < dx) { err += dx; y1 += sy; }
    }
}

function startLine(e, zoom) {
    lineDrawing = true;
    const rect = e.target.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) / zoom);
    const y = Math.floor((e.clientY - rect.top) / zoom);
    lineStart = { x: Math.max(0, Math.min(191, x)), y: Math.max(0, Math.min(62, y)) };
    // Save state
    lineHistory.push(linePixels.map(row => [...row]));
    if (lineHistory.length > 50) lineHistory.shift();
}

function moveLine(e, zoom) {
    if (!lineDrawing || !lineStart) return;
    const rect = e.target.getBoundingClientRect();
    const x = Math.max(0, Math.min(191, Math.floor((e.clientX - rect.left) / zoom)));
    const y = Math.max(0, Math.min(62, Math.floor((e.clientY - rect.top) / zoom)));

    // Restore to history
    linePixels = lineHistory[lineHistory.length - 1].map(row => [...row]);
    drawLineOnGrid(lineStart.x, lineStart.y, x, y);
    document.getElementById('lineHex').textContent = lineStart.x + ':' + lineStart.y + ' > ' + x + ':' + y;
    renderLine(zoom);
}

function endLine() {
    if (!lineDrawing) return;
    lineDrawing = false;
    lineStart = null;
    updateLineRop();
}

function clearLine() {
    linePixels = new Array(63).fill(null).map(() => new Array(192).fill(false));
    lineHistory = [];
    const zoom = parseInt(document.getElementById('lineZoom').value) || 8;
    renderLine(zoom);
    document.getElementById('lineHex').textContent = '';
}

function undoLine() {
    if (lineHistory.length > 0) {
        linePixels = lineHistory.pop().map(row => [...row]);
        const zoom = parseInt(document.getElementById('lineZoom').value) || 8;
        renderLine(zoom);
        updateLineRop();
    }
}

function updateLineRop() {
    const lines = [];
    // Convert pixel grid back to lines (simplified: just show pixel coords)
    let output = '';
    for (let y = 0; y < 63; y++) {
        for (let x = 0; x < 192; x++) {
            if (linePixels[y][x]) {
                // Find connected pixels to form a line
                output += x + ':' + y + ' ';
            }
        }
    }
    if (!output) output = 'Vẽ line bằng cách kéo chuột';
    document.getElementById('lineHex').textContent = output;
}

function copyLineRop() {
    const text = document.getElementById('lineHex').textContent;
    if (text && !text.includes('Vẽ line')) navigator.clipboard.writeText(text).catch(()=>{});
}

// Init
document.addEventListener('DOMContentLoaded', () => {
    regenImage();
    initBitmap();
    initPixel();
    initLineDraw();
});
</script>
